name: Publish StreamHUB updates
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    # Enable after adding the signing secrets documented in UPDATE_SETUP.md.
    if: ${{ vars.STREAMHUB_AUTO_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMHUB_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing STREAMHUB_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamhub-release.jks"

      - name: Build signed release APK
        env:
          STREAMHUB_CI_BUILD_NUMBER: ${{ github.run_number }}
          STREAMHUB_SIGNING_STORE_FILE: ${{ runner.temp }}/streamhub-release.jks
          STREAMHUB_SIGNING_STORE_PASSWORD: ${{ secrets.STREAMHUB_STORE_PASSWORD }}
          STREAMHUB_SIGNING_KEY_ALIAS: ${{ secrets.STREAMHUB_KEY_ALIAS }}
          STREAMHUB_SIGNING_KEY_PASSWORD: ${{ secrets.STREAMHUB_KEY_PASSWORD }}
        run: |
          test -n "$STREAMHUB_SIGNING_STORE_PASSWORD" && test -n "$STREAMHUB_SIGNING_KEY_ALIAS" && test -n "$STREAMHUB_SIGNING_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon

      - name: Publish as latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="2.7.${GITHUB_RUN_NUMBER}"
          version_code="$((100000 + GITHUB_RUN_NUMBER))"
          tag="v${version}"
          apk="StreamHUB-${tag}-vc${version_code}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "StreamHUB ${tag}" \
            --notes "StreamHUB Android TV Update, Build ${GITHUB_RUN_NUMBER}. Automatisch aus main erstellt. Paket-VersionCode: ${version_code}."
